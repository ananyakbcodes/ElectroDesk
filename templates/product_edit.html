{% extends "base.html" %}
{% block title %}Edit {{ product.product_code }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2>Edit Product: {{ product.product_code }}</h2>
  <p style="font-size: 13px; color: var(--muted);">
    Current Stock: <strong>{{ product.stock_qty }} {{ product.unit }}</strong> (Use Stock Check or Purchases to adjust stock quantity).
  </p>
  <form method="POST" action="{{ url_for('products.edit', product_id=product.id) }}">
    <div class="form-group" style="margin-bottom: 12px;">
      <label>Product Name *</label>
      <input type="text" name="name" value="{{ product.name }}" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Unit *</label>
        <select name="unit">
          {% for u in allowed_units %}
          <option value="{{ u }}" {% if product.unit == u %}selected{% endif %}>{{ u }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Min Stock Alert Level</label>
        <input type="number" step="0.01" min="0" name="min_stock_threshold" value="{{ product.min_stock_threshold }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Selling Price (₹) *</label>
        <input type="number" step="0.01" min="0" name="selling_price" value="{{ product.selling_price }}" required>
      </div>
      <div class="form-group">
        <label>Reference Purchase Cost (₹)</label>
        <input type="number" step="0.01" min="0" name="purchase_cost" value="{{ product.purchase_cost }}" required>
      </div>
    </div>
    <div style="margin: 12px 0;">
      <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
        <input type="checkbox" name="is_active" value="1" {% if product.is_active %}checked{% endif %}>
        Product is Active (visible on new bills)
      </label>
    </div>
    <button type="submit" class="btn btn-success">Update Product</button>
    <a href="{{ url_for('products.index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
