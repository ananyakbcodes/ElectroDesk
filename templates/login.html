{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card login-box">
  <h2>ElectroDesk Operator Login</h2>
  <p style="color: var(--muted); margin-top: 0;">Sign in to manage store billing and inventory.</p>
  <form method="POST" action="{{ url_for('main.login') }}">
    <div class="form-group" style="margin-bottom: 12px;">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>
    </div>
    <div class="form-group" style="margin-bottom: 16px;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn" style="width: 100%;">Log In</button>
  </form>
  <p style="font-size: 12px; color: var(--muted); margin-top: 14px; margin-bottom: 0;">
    Default academic login: <strong>admin</strong> / <strong>admin123</strong>
  </p>
</div>
{% endblock %}
