{% extends "base.html" %}
{% block title %}New Sale Bill{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Create New Sale Bill</h1>
  <a href="{{ url_for('sales.billing_list') }}" class="btn btn-secondary">All Bills</a>
</div>

<form method="POST" action="{{ url_for('sales.new_bill') }}" id="billForm">
  <input type="hidden" name="submission_token" value="{{ submission_token }}">

  <div class="card">
    <h3>1. Customer &amp; Bill Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Bill Date *</label>
        <input type="date" name="sale_date" value="{{ today }}" required>
      </div>
      <div class="form-group" style="flex: 2;">
        <label>Registered Credit Customer (Required if leaving unpaid balance)</label>
        <select name="customer_id" id="customerSelect">
          <option value="">-- Walk-in Cash/UPI Customer --</option>
          {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }} {% if c.phone %}({{ c.phone }}){% endif %} — Due: ₹{{ c.outstanding_balance }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Walk-in Name (Optional)</label>
        <input type="text" name="walkin_name" placeholder="Cash buyer name">
      </div>
      <div class="form-group">
        <label>Walk-in Phone (Optional)</label>
        <input type="text" name="walkin_phone" placeholder="Mobile number">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="page-header" style="margin-bottom: 8px;">
      <h3 style="margin: 0;">2. Line Items</h3>
      <button type="button" class="btn btn-sm" onclick="addLineRow()">+ Add Item Row</button>
    </div>
    <div class="table-wrap">
      <table id="itemsTable">
        <thead>
          <tr>
            <th style="width: 42%;">Product (Available Stock)</th>
            <th style="width: 16%;">Qty (pcs / m)</th>
            <th style="width: 18%;">Unit Price (₹)</th>
            <th class="num" style="width: 16%;">Line Total (₹)</th>
            <th style="width: 8%;">Remove</th>
          </tr>
        </thead>
        <tbody id="itemsBody">
          <tr class="item-row">
            <td>
              <select name="product_id[]" class="prod-select" onchange="onProductChange(this)" required style="width: 100%;">
                <option value="" data-price="0">-- Select Electrical Item --</option>
                {% for p in products %}
                <option value="{{ p.id }}" data-price="{{ p.selling_price }}">
                  {{ p.product_code }} — {{ p.name }} (Avail: {{ p.stock_qty }} {{ p.unit }})
                </option>
                {% endfor %}
              </select>
            </td>
            <td><input type="number" step="0.01" min="0.01" name="quantity[]" class="qty-input" value="1" oninput="recalcTotals()" required style="width: 100%;"></td>
            <td><input type="number" step="0.01" min="0" name="unit_price[]" class="price-input" value="0.00" oninput="recalcTotals()" required style="width: 100%;"></td>
            <td class="num line-total">0.00</td>
            <td><button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">X</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>3. Totals &amp; Payment</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Subtotal (₹)</label>
        <input type="text" id="subtotalDisplay" value="0.00" readonly style="background: #f1f5f9; font-weight: 700;">
      </div>
      <div class="form-group">
        <label>Discount (₹)</label>
        <input type="number" step="0.01" min="0" name="discount" id="discountInput" value="0" oninput="recalcTotals()">
      </div>
      <div class="form-group">
        <label>Tax Rate (%)</label>
        <input type="number" step="0.01" min="0" max="100" name="tax_rate" id="taxInput" value="{{ default_tax_rate }}" oninput="recalcTotals()">
      </div>
      <div class="form-group">
        <label>Grand Total (₹)</label>
        <input type="text" id="grandTotalDisplay" value="0.00" readonly style="background: #dcfce7; font-weight: 700; font-size: 16px;">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Amount Paid Now (₹) *</label>
        <input type="number" step="0.01" min="0" name="paid_amount" id="paidInput" value="0.00" required>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select name="payment_method">
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
          <option value="Card">Card</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="button" class="btn btn-secondary" onclick="fillFullPaid()">Full Paid</button>
      <button type="submit" class="btn btn-success" style="padding: 10px 22px; font-size: 15px;">Complete &amp; Print Bill</button>
    </div>
  </div>
</form>

<script>
function onProductChange(sel) {
  const opt = sel.options[sel.selectedIndex];
  const price = opt.getAttribute("data-price") || "0.00";
  const row = sel.closest("tr");
  row.querySelector(".price-input").value = parseFloat(price).toFixed(2);
  recalcTotals();
}

function addLineRow() {
  const tbody = document.getElementById("itemsBody");
  const firstRow = tbody.querySelector(".item-row");
  const clone = firstRow.cloneNode(true);
  clone.querySelector(".prod-select").selectedIndex = 0;
  clone.querySelector(".qty-input").value = "1";
  clone.querySelector(".price-input").value = "0.00";
  clone.querySelector(".line-total").textContent = "0.00";
  tbody.appendChild(clone);
}

function removeRow(btn) {
  const tbody = document.getElementById("itemsBody");
  if (tbody.querySelectorAll(".item-row").length > 1) {
    btn.closest("tr").remove();
    recalcTotals();
  }
}

function recalcTotals() {
  let subtotal = 0;
  document.querySelectorAll("#itemsBody .item-row").forEach(row => {
    const qty = parseFloat(row.querySelector(".qty-input").value) || 0;
    const price = parseFloat(row.querySelector(".price-input").value) || 0;
    const line = qty * price;
    row.querySelector(".line-total").textContent = line.toFixed(2);
    subtotal += line;
  });
  const discount = parseFloat(document.getElementById("discountInput").value) || 0;
  const taxRate = parseFloat(document.getElementById("taxInput").value) || 0;
  const taxable = Math.max(0, subtotal - discount);
  const taxAmt = taxable * (taxRate / 100);
  const grandTotal = taxable + taxAmt;

  document.getElementById("subtotalDisplay").value = subtotal.toFixed(2);
  document.getElementById("grandTotalDisplay").value = grandTotal.toFixed(2);
}

function fillFullPaid() {
  document.getElementById("paidInput").value = document.getElementById("grandTotalDisplay").value;
}
</script>
{% endblock %}
